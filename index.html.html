<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💖 Para Você 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Poppins,sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:linear-gradient(135deg,#4b0f1f,#6b1d2f,#8b2e3f); /* vinho */
}

.container{
  width:90%;
  max-width:760px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
  border-radius:30px;
  padding:35px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  text-align:center;
  z-index:10;
  position:relative;
}

h1{
  font-family:'Great Vibes';
  font-size:65px;
  color:#ffb6c1;
  margin-bottom:15px;
}

p{color:#eee;margin-bottom:20px;font-family:"Segoe Script","Lucida Handwriting",cursive;}

textarea{
  width:100%;
  height:170px;
  padding:18px;
  border:none;
  border-radius:20px;
  font-size:17px;
  resize:none;
  outline:none;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
  font-family:"Segoe Script","Lucida Handwriting",cursive;
}

input[type=file]{
  display:none;
}

label{
  display:inline-block;
  padding:12px 25px;
  border-radius:30px;
  background:linear-gradient(135deg,#ff4f87,#ff7fa9);
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
label:hover{
  transform:scale(1.05);
  background:linear-gradient(135deg,#ff2f73,#ff5f98);
}

button{
  margin-top:20px;
  padding:16px 45px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#ff4f87,#ff7fa9);
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
  font-family:"Segoe Script","Lucida Handwriting",cursive;
}
button:hover{
  transform:scale(1.05);
  background:linear-gradient(135deg,#ff2f73,#ff5f98);
}

#foto{
  width:260px;
  max-width:100%;
  border-radius:25px;
  padding:10px;
  background:white;
  box-shadow:0 10px 20px rgba(0,0,0,.15);
  display:none;
  margin:auto;
  margin-bottom:25px;
  transform:rotate(-2deg);
}

#mensagem{
  font-size:23px;
  line-height:40px;
  color:#fff;
  white-space:pre-wrap;
  font-family:"Segoe Script","Lucida Handwriting",cursive;
}

#linkGerado{
  margin-top:20px;
  font-size:18px;
  color:#ffb6c1;
}
#linkGerado a{
  color:#fff;
  font-weight:bold;
  text-decoration:none;
}
#linkGerado a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="container">
  <h1>💖 Para Você 💖</h1>
  <p>Escreva algo que vem do coração.</p>
  <textarea id="texto" placeholder="Meu amor... ❤️"></textarea>

  <h3 style="color:#fff;font-family:'Segoe Script','Lucida Handwriting',cursive;">📷 Escolha uma foto</h3>
  <label for="imagem">Selecionar Foto</label>
  <input type="file" id="imagem" accept="image/*">

  <br>
  <button onclick="criar()">💌 Criar Minha Cartinha</button>

  <div id="resultado">
    <img id="foto">
    <div id="mensagem"></div>
    <p id="linkGerado"></p>
  </div>
</div>

<script>
function criar(){
  const texto=document.getElementById("texto").value;

  let imgSrc="";
  const img=document.getElementById("imagem").files[0];
  if(img){
    let leitor=new FileReader();
    leitor.onload=e=>{
      imgSrc=e.target.result;
      gerarCartinha(texto,imgSrc);
    }
    leitor.readAsDataURL(img);
  } else {
    gerarCartinha(texto,"");
  }

  function gerarCartinha(texto,imgSrc){
    const conteudo=`
      <html>
      <head><meta charset="UTF-8"><title>Minha Cartinha</title>
      <style>
        body{font-family:'Segoe Script','Lucida Handwriting',cursive;text-align:center;
             background:linear-gradient(135deg,#4b0f1f,#6b1d2f,#8b2e3f);overflow:hidden;color:#fff;}
        h1{color:#ffb6c1;font-size:60px;}
        p{font-size:24px;}
        img{max-width:300px;border-radius:20px;margin:20px auto;display:block;}
        .coracao{position:fixed;font-size:25px;color:#ff5f98;animation:subir linear forwards;pointer-events:none;}
        @keyframes subir{
          0%{transform:translateY(100vh);opacity:0;}
          20%{opacity:1;}
          100%{transform:translateY(-120px);opacity:0;}
        }
      </style></head>
      <body>
        <h1>💌 Minha Cartinha Para Você 💌</h1>
        <p>${texto}</p>
        ${imgSrc ? `<img src="${imgSrc}">` : ""}
        <script>
          function coracao(){
            let c=document.createElement("div");
            c.className="coracao";
            c.innerHTML=["💖","❤️","💕","💗","🌸"][Math.floor(Math.random()*5)];
            c.style.left=Math.random()*100+"vw";
            c.style.fontSize=(20+Math.random()*25)+"px";
            c.style.animationDuration=(4+Math.random()*4)+"s";
            document.body.appendChild(c);
            setTimeout(()=>{c.remove();},8000);
          }
          setInterval(coracao,350);
        <\/script>
      </body>
      </html>
    `;
    const blob=new Blob([conteudo],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    document.getElementById("linkGerado").innerHTML=`👉 Sua cartinha está pronta: <a href="${url}" target="_blank">Abrir Cartinha</a>`;
  }
}
</script>

</body>
</html>
